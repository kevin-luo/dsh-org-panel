name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # 临时发布迁移步骤：让真实 npm 生成 2.0.0 + sharp 0.35.3 的准确 lock，
      # 通过 artifact 取回提交后立即删除，最终 CI 只保留 npm ci + audit。
      - run: npm version 2.0.0 --no-git-tag-version
      - run: npm install --package-lock-only --ignore-scripts --save-dev sharp@0.35.3
      - uses: actions/upload-artifact@v4
        with:
          name: release-lock
          path: |
            package.json
            package-lock.json
          retention-days: 1
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: node --test tests/*.test.mjs
      - run: npm run size-check
